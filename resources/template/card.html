<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{pageTitle}}</title>
  <link rel="stylesheet" href="{{ResPath}}common/codetime.css" />
</head>
<body>
  <main class="ct-shell">
    <div class="ct-frame">
      <div class="ct-stripes" aria-hidden="true"></div>
      <header class="hero">
        <div class="hero-main">
          <div class="hero-kicker">
            <span class="brand-dot"></span>
            <span>CodeTime</span>
            <span class="hero-type">{{typeLabel}}</span>
          </div>
          <h1 class="title">{{title}}</h1>
          <div class="subtitle">{{subtitle}}</div>
        </div>
        <div class="hero-aside">
          <div class="stamp">{{generatedAt}}</div>
          <div class="badges">{{@ badgesHtml}}</div>
        </div>
      </header>
      <div class="ct-stripes" aria-hidden="true"></div>

      <div class="content">
        {{@ metricsBlockHtml}}
        {{@ sectionsHtml}}
        {{@ sessionsHtml}}
        <div class="footer">CodeTime-plugin · rendered from codetime.dev</div>
      </div>
    </div>
  </main>
</body>
</html>
