<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{pageTitle}}</title>
  <link rel="preload" href="{{ResPath}}fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ResPath}}fonts/inter/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-display: block;
      font-weight: 100 900;
      src: url("{{ResPath}}fonts/inter/inter-latin-ext-wght-normal.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-display: block;
      font-weight: 100 900;
      src: url("{{ResPath}}fonts/inter/inter-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    html:not(.fonts-ready) body {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      var root = document.documentElement
      function reveal() {
        root.classList.add('fonts-ready')
      }
      if (!document.fonts || !document.fonts.ready) {
        reveal()
        return
      }
      document.fonts.ready.then(reveal).catch(reveal)
      setTimeout(reveal, 2000)
    })()
  </script>
  <link rel="stylesheet" href="{{ResPath}}common/codetime.css" />
</head>
<body>
  <main class="ct-shell">
    <div class="ct-frame">
      <div class="ct-stripes" aria-hidden="true"></div>
      <header class="hero">
        <div class="hero-main">
          <h1 class="title"><span class="brand-dot" aria-hidden="true"></span>{{title}}</h1>
          <div class="subtitle">{{subtitle}}</div>
        </div>
        <div class="hero-aside{{heroAsideClass}}">
          <div class="hero-user">
            <div class="hero-avatar" aria-hidden="true">
              <div class="hero-avatar-fallback">{{heroUserInitial}}</div>
              {{@ heroUserAvatarHtml}}
            </div>
            <div class="hero-user-text">
              <div class="hero-user-name">{{heroUserName}}</div>
            </div>
          </div>
        </div>
      </header>
      <div class="ct-stripes" aria-hidden="true"></div>

      <div class="content">
        {{@ metricsBlockHtml}}
        {{@ sectionsHtml}}
        {{@ sessionsHtml}}
        <div class="footer">CodeTime-plugin · rendered from codetime.dev</div>
      </div>
    </div>
  </main>
</body>
</html>
